name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true

      - name: Setup Bats
        if: runner.os == 'Linux'
        uses: bats-core/bats-action@3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        if: runner.os != 'Windows'
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -buildvcs=false -trimpath ./cmd/clai

      - name: Test Unix release installer
        if: runner.os == 'Linux'
        run: bats test

      - name: Test Windows release installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test/install-release.ps1
