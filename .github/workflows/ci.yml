name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true

      - name: Setup Bats
        uses: bats-core/bats-action@3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run checks
        run: make check
