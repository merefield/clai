name: Refresh Go dependencies (one-shot)

on:
  push:
    branches:
      - codex/duplication-ratchet-dependency-refresh
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/duplication-ratchet-dependency-refresh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Upgrade all Go modules and tidy
        run: |
          go get -u -t ./...
          go mod tidy
          go mod verify
      - name: Validate upgraded modules
        run: |
          go vet ./...
          go test -race ./...
          go build -buildvcs=false -trimpath ./cmd/clai
      - name: Commit upgraded module manifests
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "All Go dependencies already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "CHORE: upgrade Go dependencies to latest compatible versions"
          git push origin HEAD:codex/duplication-ratchet-dependency-refresh
