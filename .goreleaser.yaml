version: 2

project_name: clai

builds:
  - id: clai
    main: ./cmd/clai
    binary: clai
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X github.com/merefield/clai/internal/app.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
